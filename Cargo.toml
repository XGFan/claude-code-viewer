[workspace]
members = ["crates/cv-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
cv-core = { path = "crates/cv-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# Exact pin: the specta rc API changes between releases (crate docs mandate "=").
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
# bundled => FTS5 + SQLite 3.53.2
rusqlite = { version = "0.40.2", features = ["bundled"] }
rayon = "1.12"
memchr = "2.8"
aho-corasick = "1.1"
thiserror = "2.0"
tracing = "0.1.44"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
libc = "0.2.190"
parking_lot = "0.12.5"
crossbeam-channel = "0.5.17"
dirs = "7.0"
tempfile = "3.27"

tauri = { version = "2.12.1", features = ["specta"] }
tauri-build = { version = "2.7.1", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tauri-plugin-opener = "2.7.0"
tauri-plugin-clipboard-manager = "2.4.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tracing-subscriber = "0.3.23"

# On macOS 27 (ld-27037), proc-macro dylibs that cargo strips in release builds with
# MACOSX_DEPLOYMENT_TARGET >= 14 (set by `tauri build` from minimumSystemVersion) fail to
# load in rustc ("mis-aligned LINKEDIT string pool"). Keep build-time artifacts unstripped.
[profile.release.build-override]
strip = "none"
